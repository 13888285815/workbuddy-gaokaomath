<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考数学试卷浏览器</title>
<style>
:root {
  --bg-primary: #1a1d23;
  --bg-secondary: #21252b;
  --bg-tertiary: #282c34;
  --bg-hover: #2c313a;
  --bg-active: #3a3f4b;
  --border: #333842;
  --text-primary: #e1e4e8;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --accent-dim: #1f6feb;
  --sidebar-width: 300px;
  --toolbar-height: 48px;
  --scrollbar-bg: #1a1d23;
  --scrollbar-thumb: #484f58;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* Toolbar */
#toolbar {
  height: var(--toolbar-height);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}
#toolbar .logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}
#toolbar .stats {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
}
#toolbar .spacer { flex:1; }
#toolbar .gh-pages-badge {
  font-size: 11px;
  background: var(--accent-dim);
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
}
#search-box {
  width: 280px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  padding: 0 12px 0 32px;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
#search-box:focus { border-color: var(--accent); }
#search-wrap {
  position: relative;
}
#search-wrap::before {
  content: "\1F50D";
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  pointer-events: none;
}
#clear-search {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  display: none;
  padding: 2px 4px;
}
#clear-search.visible { display: block; }

/* Main layout */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}
/* Sidebar */
#sidebar {
  width: var(--sidebar-width);
  min-width: 200px;
  max-width: 500px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
#resize-handle {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  cursor: col-resize;
  z-index: 5;
  transition: background .15s;
}
#resize-handle:hover,
#resize-handle.active { background: var(--accent); }
#tree-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 0;
}
#tree-container::-webkit-scrollbar { width:6px; }
#tree-container::-webkit-scrollbar-track { background:var(--scrollbar-bg); }
#tree-container::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border-radius:3px; }

/* Tree */
.tree-node { user-select: none; }
.tree-row {
  display: flex;
  align-items: center;
  height: 32px;
  padding: 0 12px;
  cursor: pointer;
  transition: background .12s;
  gap: 6px;
  white-space: nowrap;
}
.tree-row:hover { background: var(--bg-hover); }
.tree-row.active { background: var(--bg-active); }
.tree-row .arrow {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text-muted);
  flex-shrink: 0;
  transition: transform .15s;
}
.tree-row .arrow.expanded { transform: rotate(90deg); }
.tree-row .arrow.hidden { visibility: hidden; }
.tree-row .icon {
  font-size: 14px;
  flex-shrink: 0;
  width: 18px;
  text-align: center;
}
.tree-row .name {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.tree-row .badge {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-tertiary);
  padding: 1px 6px;
  border-radius: 8px;
  flex-shrink: 0;
}
.tree-children { overflow: hidden; }
.tree-children.collapsed { display: none; }
.tree-row.category .name { font-weight: 600; color: var(--text-primary); }
.tree-row.year .name { color: var(--text-secondary); }
.tree-row.file .name { color: var(--text-secondary); font-size: 12px; padding-left: 4px; }
.tree-row.file.active .name { color: var(--accent); }
.tree-row .highlight { color: var(--accent); font-weight: 600; }

/* Right panel */
#viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  overflow: hidden;
}
#viewer-header {
  height: 40px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
}
#viewer-header .filename {
  font-size: 13px;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
#viewer-header button {
  background: var(--bg-hover);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  transition: all .15s;
}
#viewer-header button:hover { background: var(--bg-active); color: var(--text-primary); }
#viewer-header button:disabled { opacity: .4; cursor: not-allowed; }
#page-info {
  font-size: 12px;
  color: var(--text-muted);
  min-width: 80px;
  text-align: center;
}
#load-timing {
  font-size: 12px;
  color: var(--accent);
  min-width: 100px;
  white-space: nowrap;
}
#pdf-container {
  flex: 1;
  overflow: auto;
  display: flex;
  justify-content: center;
  padding: 24px;
}
#pdf-container::-webkit-scrollbar { width:8px; }
#pdf-container::-webkit-scrollbar-track { background:var(--scrollbar-bg); }
#pdf-container::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border-radius:4px; }
#pdf-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  gap: 12px;
  text-align: center;
  padding: 24px;
}
#pdf-placeholder .ph-icon { font-size: 48px; opacity: .4; }
#pdf-placeholder .ph-text { font-size: 14px; }
#pdf-placeholder .ph-hint {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  max-width: 400px;
  line-height: 1.6;
}
#pdf-placeholder .ph-hint a {
  color: var(--accent);
  text-decoration: none;
}
canvas { max-width: 100%; height: auto !important; box-shadow: 0 2px 16px rgba(0,0,0,.4); border-radius: 4px; }

/* Loading */
#loading {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  z-index: 100;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }

/* Mobile */
@media (max-width: 768px) {
  #sidebar {
    position: fixed;
    left: 0;
    top: var(--toolbar-height);
    bottom: 0;
    z-index: 20;
    transform: translateX(-100%);
    transition: transform .25s;
    width: 280px !important;
  }
  #sidebar.open { transform: translateX(0); }
  #mobile-toggle {
    display: flex !important;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
  }
  #search-box { width: 160px; }
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 15;
  }
  #overlay.show { display: block; }
}
@media (min-width: 769px) {
  #mobile-toggle { display: none; }
  #overlay { display: none; }
}
</style>
</head>
<body>

<div id="toolbar">
  <button id="mobile-toggle">&#9776;</button>
  <span class="logo">&#128209; 高考数学</span>
  <span class="stats" id="stats">共 0 份试卷</span>
  <span class="gh-pages-badge">&#127760; Demo</span>
  <span class="spacer"></span>
  <div id="search-wrap">
    <input type="text" id="search-box" placeholder="搜索试卷名称 (支持拼音首字母)...">
    <button id="clear-search">&#10005;</button>
  </div>
</div>

<div id="overlay"></div>
<div id="main">
  <div id="sidebar">
    <div id="resize-handle"></div>
    <div id="tree-container"></div>
  </div>
  <div id="viewer">
    <div id="viewer-header" class="hidden">
      <span class="filename" id="current-filename"></span>
      <span id="page-info"></span>
      <span id="load-timing"></span>
      <button id="btn-prev" disabled>&#9664; 上一页</button>
      <button id="btn-next" disabled>下一页 &#9654;</button>
    </div>
    <div id="pdf-container">
      <div id="pdf-placeholder">
        <span class="ph-icon">&#128196;</span>
        <span class="ph-text">从左侧选择一份试卷开始浏览</span>
      </div>
    </div>
  </div>
</div>

<div id="loading" class="hidden"><div class="spinner"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.js"></script>

<script>
// pdf.js setup
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.js';

// State
let treeData = [];
let currentPdfDoc = null;
let currentPage = 1;
let totalPages = 0;
let selectedPath = null;
let searchQuery = '';
let loadStartTime = 0;

// DOM refs
const $tree = document.getElementById('tree-container');
const $search = document.getElementById('search-box');
const $clearSearch = document.getElementById('clear-search');
const $stats = document.getElementById('stats');
const $viewerHeader = document.getElementById('viewer-header');
const $currentFilename = document.getElementById('current-filename');
const $pageInfo = document.getElementById('page-info');
const $loadTiming = document.getElementById('load-timing');
const $btnPrev = document.getElementById('btn-prev');
const $btnNext = document.getElementById('btn-next');
const $pdfContainer = document.getElementById('pdf-container');
const $placeholder = document.getElementById('pdf-placeholder');
const $loading = document.getElementById('loading');
const $sidebar = document.getElementById('sidebar');
const $overlay = document.getElementById('overlay');
const $mobileToggle = document.getElementById('mobile-toggle');
const $resizeHandle = document.getElementById('resize-handle');

// Pinyin first-letter map
const PINYIN_MAP = {
  '高':'g','考':'k','数':'s','学':'x','普':'p','通':'t','春':'c','季':'j',
  '北':'b','京':'j','上':'s','海':'h','天':'t','津':'j','重':'c','庆':'q',
  '河':'h','北':'b','南':'n','山':'s','东':'d','西':'x','陕':'s',
  '甘':'g','肃':'s','青':'q','宁':'n','新':'x','疆':'j','西':'x','藏':'z',
  '内':'n','蒙':'m','古':'g','辽':'l','吉':'j','林':'l','黑':'h','龙':'l',
  '江':'j','苏':'s','浙':'z','安':'a','徽':'h','福':'f','建':'j',
  '湖':'h','广':'g','东':'d','海':'h','四':'s','川':'c',
  '贵':'g','州':'z','云':'y','台':'t','港':'g','澳':'a','全':'q','国':'g',
  '文':'w','理':'l','一':'y','二':'e','三':'s','甲':'j','乙':'y','丙':'b',
  '卷':'j','年':'n','月':'y','日':'r','真':'z','题':'t','答':'d','案':'a',
  '解':'j','析':'x','选':'x','择':'z','填':'t','空':'k','简':'j','计':'j',
  '证':'z','明':'m','综':'z','合':'h','分':'f','类':'l','汇':'h','总':'z',
  '模':'m','拟':'n','预':'y','测':'c','冲':'c','刺':'c','复':'f','习':'x',
  '强':'q','化':'h','基':'j','础':'c','提':'t','升':'s','压':'y','轴':'z',
  '历':'l','史':'s','回':'h','顾':'g','精':'j','编':'b','汇':'h','编':'b',
  '专':'z','项':'x','训':'x','练':'l','测':'c','评':'p','检':'j','测':'c',
  '联':'l','校':'x','省':'s','大':'d','纲':'g','标':'b','准':'z','参':'c',
  '课':'k','程':'c','教':'j','材':'c','辅':'f','导':'d','讲':'j','义':'y',
  '笔':'b','记':'j','错':'c','典':'d','型':'x','例':'l','拓':'t','展':'z',
  '延':'y','申':'s','优':'y','秀':'x','名':'m','师':'s','团':'t','队':'d',
};
function getPinyinFirst(str) {
  let result = '';
  for (const ch of str) {
    result += PINYIN_MAP[ch] || ch.toLowerCase();
  }
  return result;
}
function matchPinyin(target, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  if (target.toLowerCase().includes(q)) return true;
  return getPinyinFirst(target).includes(q);
}

// Tree rendering
function filterTree(nodes, query) {
  if (!query) return nodes;
  const result = [];
  for (const node of nodes) {
    if (node.type === 'file') {
      if (matchPinyin(node.name, query)) result.push(node);
    } else {
      const filteredChildren = filterTree(node.children || [], query);
      if (filteredChildren.length > 0) {
        result.push({ ...node, children: filteredChildren, count: filteredChildren.length });
      } else if (matchPinyin(node.name, query)) {
        result.push(node);
      }
    }
  }
  return result;
}

function renderTree(nodes, container, depth = 0) {
  for (const node of nodes) {
    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';

    const row = document.createElement('div');
    row.className = `tree-row ${node.type}`;
    row.style.paddingLeft = `${12 + depth * 18}px`;
    row.dataset.type = node.type;
    if (node.type === 'file') row.dataset.path = node.path;

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    if (node.type === 'file') arrow.classList.add('hidden');
    else if (node.type === 'category') arrow.classList.add('expanded');
    arrow.textContent = '\u25B6';
    row.appendChild(arrow);

    const icon = document.createElement('span');
    icon.className = 'icon';
    if (node.type === 'category') icon.textContent = '\uD83D\uDCC1';
    else if (node.type === 'year') icon.textContent = '\uD83D\uDCC2';
    else icon.textContent = '\uD83D\uDCC4';
    row.appendChild(icon);

    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    if (searchQuery && matchPinyin(node.name, searchQuery)) {
      nameSpan.innerHTML = highlightMatch(node.name, searchQuery);
    } else {
      nameSpan.textContent = node.name;
    }
    row.appendChild(nameSpan);

    if (node.type !== 'file' && node.count !== undefined) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = node.count;
      row.appendChild(badge);
    }

    wrapper.appendChild(row);

    if (node.children && node.children.length > 0) {
      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'tree-children';
      if (node.type === 'year') childrenDiv.classList.add('collapsed');
      renderTree(node.children, childrenDiv, depth + 1);
      wrapper.appendChild(childrenDiv);

      row.addEventListener('click', (e) => {
        e.stopPropagation();
        childrenDiv.classList.toggle('collapsed');
        arrow.classList.toggle('expanded');
      });
    } else if (node.type !== 'file') {
      arrow.classList.add('hidden');
    }

    if (node.type === 'file') {
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        loadPdf(node.url, node.name);
        document.querySelectorAll('.tree-row.file.active').forEach(r => r.classList.remove('active'));
        row.classList.add('active');
      });
    }

    container.appendChild(wrapper);
  }
}

function highlightMatch(text, query) {
  const q = query.toLowerCase();
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) {
    const py = getPinyinFirst(text);
    const pyIdx = py.indexOf(q);
    if (pyIdx === -1) return text;
    return `<span class="highlight">${text}</span>`;
  }
  return text.slice(0, idx) + `<span class="highlight">${text.slice(idx, idx + q.length)}</span>` + text.slice(idx + q.length);
}

function rebuildTree() {
  $tree.innerHTML = '';
  const filtered = filterTree(treeData, searchQuery);
  renderTree(filtered, $tree);
  let total = 0;
  function countFiles(nodes) {
    for (const n of nodes) {
      if (n.type === 'file') total++;
      else if (n.children) countFiles(n.children);
    }
  }
  countFiles(filtered);
  $stats.textContent = `共 ${total} 份试卷`;
}

// PDF loading - static version with fallback
async function loadPdf(url, filename) {
  $loading.classList.remove('hidden');
  $placeholder.classList.add('hidden');
  $viewerHeader.classList.remove('hidden');
  $currentFilename.textContent = filename;
  $loadTiming.textContent = '加载中...';
  currentPage = 1;
  selectedPath = url;
  loadStartTime = performance.now();

  try {
    try {
      currentPdfDoc = await pdfjsLib.getDocument(url).promise;
    } catch (directErr) {
      console.warn('Direct PDF load failed, trying fetch fallback:', directErr.message);
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const buffer = await resp.arrayBuffer();
      currentPdfDoc = await pdfjsLib.getDocument({data: buffer}).promise;
    }
    totalPages = currentPdfDoc.numPages;
    $pageInfo.textContent = `1 / ${totalPages}`;
    $btnPrev.disabled = true;
    $btnNext.disabled = totalPages <= 1;
    await renderPage(1);
    const elapsed = ((performance.now() - loadStartTime) / 1000).toFixed(2);
    $loadTiming.textContent = `加载耗时：${elapsed} 秒`;
  } catch (err) {
    console.error('PDF load error:', err);
    $loadTiming.textContent = '加载失败';
    $pdfContainer.innerHTML = '';
    const placeholder = document.createElement('div');
    placeholder.id = 'pdf-placeholder';
    placeholder.innerHTML = `
      <span class="ph-icon">&#128196;</span>
      <span class="ph-text">加载失败：${err.message}</span>
    `;
    $pdfContainer.appendChild(placeholder);
    $viewerHeader.classList.add('hidden');
  }
  $loading.classList.add('hidden');
}

async function renderPage(pageNum) {
  if (!currentPdfDoc) return;
  const page = await currentPdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.height = viewport.height;
  canvas.width = viewport.width;
  await page.render({ canvasContext: ctx, viewport }).promise;

  $pdfContainer.innerHTML = '';
  $pdfContainer.appendChild(canvas);
  $pageInfo.textContent = `${pageNum} / ${totalPages}`;
  $btnPrev.disabled = pageNum <= 1;
  $btnNext.disabled = pageNum >= totalPages;
}

// Navigation
$btnPrev.addEventListener('click', () => {
  if (currentPage > 1) { currentPage--; renderPage(currentPage); }
});
$btnNext.addEventListener('click', () => {
  if (currentPage < totalPages) { currentPage++; renderPage(currentPage); }
});
document.addEventListener('keydown', (e) => {
  if (!currentPdfDoc) return;
  if (e.key === 'ArrowLeft') { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
  if (e.key === 'ArrowRight') { if (currentPage < totalPages) { currentPage++; renderPage(currentPage); } }
});

// Search
$search.addEventListener('input', () => {
  searchQuery = $search.value.trim();
  $clearSearch.classList.toggle('visible', searchQuery.length > 0);
  rebuildTree();
});
$clearSearch.addEventListener('click', () => {
  $search.value = '';
  searchQuery = '';
  $clearSearch.classList.remove('visible');
  rebuildTree();
  $search.focus();
});

// Resize
let isResizing = false;
$resizeHandle.addEventListener('mousedown', (e) => {
  isResizing = true;
  $resizeHandle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const w = Math.max(200, Math.min(500, e.clientX));
  $sidebar.style.width = w + 'px';
  document.documentElement.style.setProperty('--sidebar-width', w + 'px');
});
document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    $resizeHandle.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// Mobile sidebar toggle
$mobileToggle.addEventListener('click', () => {
  $sidebar.classList.toggle('open');
  $overlay.classList.toggle('show');
});
$overlay.addEventListener('click', () => {
  $sidebar.classList.remove('open');
  $overlay.classList.remove('show');
});

// Init - load from static tree.json
async function init() {
  try {
    const resp = await fetch('tree.json');
    treeData = await resp.json();
    rebuildTree();
  } catch (err) {
    console.error('Failed to load tree:', err);
    $stats.textContent = '加载失败';
  }
}
init();
</script>
</body>
</html>
